name: Desktop installers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['SlowSnowTrade/**', 'scripts/**', 'packaging/**', 'build-mac.sh', 'package*.json', '.github/workflows/desktop-build.yml']
  release:
    types: [published]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: SlowSnowTrade-Windows-x64
          path: release/*Setup.exe
          if-no-files-found: error
  mac:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x86_64, arm64, universal]
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/package-mac.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: SlowSnowTrade-macOS-${{ matrix.arch }}
          path: release/*.dmg
          if-no-files-found: error
